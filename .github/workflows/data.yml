name: Build data
# Weekly (and manual): look for new 野球革命 open-data releases, rebuild public/data, commit if anything changed.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
permissions: { contents: write }
concurrency: { group: data, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python pipeline/tests/test_stats.py
      - run: python pipeline/fetch.py --discover > /dev/null && python pipeline/build.py
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add pipeline/sources.json public/data
          git diff --cached --quiet && { echo "no data changes"; exit 0; }
          git commit -m "data: update from rebas.tw open data"
          git push
